<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07080f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nattat</title>
<style>
html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // ============================================================
  // Settings (sizes are fractions of the play-field size)
  // ============================================================
  const GRAVITY = 1.8;             // higher = falls faster
  const JUMP_VELOCITY = 1.04;      // higher = jumps higher (jump height is about 0.30)
  const PLATFORM_W = 0.22;         // platform width at stage 1
  const PLAYER_SIZE = 0.09;        // player size at stage 1
  const MILESTONE_EVERY = 100;     // chime every N points
  const GROWTH_PER_LEVEL = 0.08;   // player grows 8% every stage
  const MAX_GROWTH = 1.9;          // player never gets bigger than 1.9x
  const STARS_TO_KEEP = 5;         // stars needed to continue from where you fell
  const STAR_CHANCE = 0.4;         // chance of a star above each new platform
  const HARD_EVERY = 5;            // every N stages is a HARD stage (more fruit rain)
  const BURN_TIME = 5;             // seconds the fire lasts after a bomb
  const SLIP_TIME = 4;             // seconds you slip after a banana
  const CELEB_TIME = 3;            // seconds of the cup celebration on the plank
  const ROCKET_SKIP = 2;           // a rocket skips this many stages
  const BOARD_TEXT = "top1.fnan";  // the text written on the wooden plank

  // Difficulty: everything below gets harder with every stage
  const PLATFORM_SHRINK = 0.05;    // platforms get 5% narrower each stage
  const MIN_PLATFORM_SCALE = 0.4;  // ...but never below 40% of the width
  const TOUCH_SENS = 1.5;          // finger drag distance -> player distance (touch screens)

  // Test helpers: index.html?level=19&fast=1 (start at stage 19, stage every 100 points)
  let qs = null;
  try { qs = new URLSearchParams(window.location.search); } catch (e) {}
  const FAST = !!qs && qs.get("fast") === "1";
  const LEVEL_POINTS = FAST ? 100 : 400;    // points needed for each new stage
  const TEST_LEVEL = Math.max(1, (qs && parseInt(qs.get("level") || "1", 10)) || 1);

  const MOVES = ["flip", "backflip", "dance", "dance", "spin"];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // play field: a portrait area centered in the window
  let vw = 0, vh = 0, dpr = 1, W = 0, H = 0, fieldX = 0;
  let g = null;   // current game state
  const input = { x: null, active: false, id: null, ax: 0, abx: 0, touch: false };
  const keys = { left: false, right: false };
  let paused = false, restarting = false, adActive = false, muted = false;
  let sdkReady = false, sdkDone = false;
  let last = performance.now();

  function loadNum(k) { try { return parseInt(localStorage.getItem(k) || "0", 10) || 0; } catch (e) { return 0; } }
  function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
  let best = loadNum("nattat_best");
  let totalStars = loadNum("nattat_stars");
  let cups = loadNum("nattat_cups");
  let bestStage = loadNum("nattat_beststage");

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }
  function mix(c1, c2, t) {
    return "rgb(" + Math.round(c1[0] + (c2[0] - c1[0]) * t) + "," +
      Math.round(c1[1] + (c2[1] - c1[1]) * t) + "," +
      Math.round(c1[2] + (c2[2] - c1[2]) * t) + ")";
  }

  // ============================================================
  // CrazyGames SDK (every call is safe if the SDK is missing)
  // ============================================================
  async function initSDK() {
    try {
      if (window.CrazyGames && window.CrazyGames.SDK) {
        await window.CrazyGames.SDK.init();
        sdkReady = true;
      }
    } catch (e) { sdkReady = false; }
    sdkDone = true;
    if (g && !g.over && !paused) gameplayStart();
  }
  function gameplayStart() { if (!sdkReady) return; try { window.CrazyGames.SDK.game.gameplayStart(); } catch (e) {} }
  function gameplayStop() { if (!sdkReady) return; try { window.CrazyGames.SDK.game.gameplayStop(); } catch (e) {} }
  function happytime() { if (!sdkReady) return; try { window.CrazyGames.SDK.game.happytime(); } catch (e) {} }
  function midgameAd(done) {
    if (!sdkReady) { done(); return; }
    let finished = false;
    const end = function () { if (finished) return; finished = true; adActive = false; applyVolume(); done(); };
    try {
      window.CrazyGames.SDK.ad.requestAd("midgame", {
        adStarted: function () { adActive = true; applyVolume(); },
        adFinished: end,
        adError: end
      });
    } catch (e) { end(); }
  }

  // ============================================================
  // Sound effects: generated with WebAudio, no audio files
  // ============================================================
  let ac = null, master = null;
  function audioInit() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.connect(ac.destination);
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === "suspended") ac.resume();
    applyVolume();
  }
  function applyVolume() { if (master) master.gain.value = (muted || adActive) ? 0 : 1; }
  function tone(f0, f1, dur, vol, delay) {
    if (!ac || muted || adActive) return;
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const gn = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(vol, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    if (!ac || muted || adActive) return;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource();
    const gn = ac.createGain();
    src.buffer = buf; gn.gain.value = vol;
    src.connect(gn); gn.connect(master);
    src.start();
  }
  const SFX = {
    bounce: function () { tone(380, 820, 0.11, 0.35); },
    milestone: function () { tone(660, 660, 0.09, 0.3); tone(990, 990, 0.16, 0.3, 0.09); },
    levelup: function () {
      [523, 659, 784].forEach(function (f, i) { tone(f, f, 0.09, 0.3, i * 0.09); });
      tone(1046, 1046, 0.25, 0.35, 0.27);
    },
    over: function () { tone(520, 110, 0.65, 0.4); },
    star: function () { tone(880, 1320, 0.09, 0.3); tone(1320, 1320, 0.12, 0.22, 0.08); },
    boom: function () { noise(0.55, 0.5); tone(160, 40, 0.5, 0.5); },
    slip: function () { tone(900, 250, 0.4, 0.3); },
    cure: function () { tone(500, 900, 0.18, 0.3); tone(900, 1200, 0.15, 0.25, 0.15); },
    cup: function () {
      [523, 659, 784, 1046, 1319].forEach(function (f, i) { tone(f, f, 0.12, 0.35, i * 0.11); });
      tone(1319, 1319, 0.6, 0.4, 0.55);
    },
    hard: function () { [0, 0.2, 0.4].forEach(function (d) { tone(220, 180, 0.16, 0.4, d); }); },
    rocket: function () { noise(0.9, 0.3); tone(120, 900, 0.8, 0.35); },
    crack: function () { noise(0.15, 0.25); tone(220, 90, 0.15, 0.2); }
  };
  function play(name) { try { SFX[name](); } catch (e) {} }
  function toggleMute() { muted = !muted; applyVolume(); }

  // ============================================================
  // Difficulty and stage geometry
  // ============================================================
  function diff(level) {
    const d = level - 1;
    return {
      width: PLATFORM_W * Math.max(MIN_PLATFORM_SCALE, 1 - PLATFORM_SHRINK * d),
      minGap: Math.min(0.16, 0.09 + 0.006 * d),
      maxGap: Math.min(0.26, 0.19 + 0.008 * d),                    // keep below jump height (~0.30)
      moving: level >= 2 ? Math.min(0.75, 0.15 * d) : 0,           // chance of a sliding platform
      speed: Math.min(0.6, 0.12 + 0.03 * d),                       // sliding speed (fraction of width per second)
      fragile: level >= 4 ? Math.min(0.35, 0.06 * (level - 3)) : 0 // chance of a cracking platform
    };
  }
  function newAt(stage) {   // what is new in a stage (shown while counting down)
    if (stage === 2) return "New: sliding platforms";
    if (stage === 3) return "New: banana peels";
    if (stage === 4) return "New: cracking platforms";
    if (stage === 6) return "New: double fruit rain";
    return "Harder: smaller platforms, faster rain";
  }
  function stageLen() { return LEVEL_POINTS / 100 * H; }        // world height of one stage
  function boardWorld(stage) { return stage * stageLen(); }      // world height of the plank at the end of a stage
  function isHard() { return g.level % HARD_EVERY === 0; }

  // ============================================================
  // Layout
  // ============================================================
  function rescale(sx, sy) {
    g.px *= sx; g.bx *= sx; g.py *= sy; g.vy *= sy; g.vx *= sx; g.slipVx *= sx;
    g.top *= sy; g.score *= sy; g.nextRocket *= sy;
    for (const p of g.platforms) { p.x *= sx; p.y *= sy; p.w *= sx; p.vx *= sx; }
    for (const s of g.stars) { s.x *= sx; s.y *= sy; }
    for (const r of g.rockets) { r.x *= sx; r.y *= sy; }
    for (const f of g.fruits) { f.x *= sx; f.y *= sy; f.vy *= sy; }
    g.parts = []; g.popups = []; g.shock = null;
    if (input.x !== null) input.x *= sx;
    input.ax *= sx; input.abx *= sx;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    const newH = vh, newW = Math.min(vw, vh * 0.6);
    if (g && W > 0 && H > 0) rescale(newW / W, newH / H);
    W = newW; H = newH;
    fieldX = (vw - W) / 2;
  }

  // ============================================================
  // Game setup
  // ============================================================
  // Builds the world upward. At the end of every stage a full-width wooden plank is placed.
  function fill() {
    while (g.top < H * 1.3) {
      const lv = g.genStage;
      const d = diff(lv);
      const gap = rand(d.minGap, d.maxGap) * H;
      const boardY = boardWorld(lv) - g.score;   // plank position on screen (y up)
      if (g.top + gap >= boardY) {
        const by = Math.max(boardY, g.top + H * 0.05);
        g.platforms.push({ x: W / 2, y: by, w: W, vx: 0, board: true, done: false, stage: lv });
        g.top = by;
        g.genStage++;
        continue;
      }
      g.top += gap;
      const pwid = d.width * W;
      const x = rand(pwid / 2, W - pwid / 2);
      const moving = Math.random() < d.moving;
      const fragile = !moving && Math.random() < d.fragile;
      const dir = Math.random() < 0.5 ? -1 : 1;
      g.platforms.push({ x: x, y: g.top, w: pwid, vx: moving ? dir * d.speed * W : 0, board: false, fragile: fragile, done: false, stage: lv });
      if (Math.random() < STAR_CHANCE) {
        // a star floating above the platform
        g.stars.push({ x: rand(W * 0.1, W * 0.9), y: g.top + rand(0.05, 0.12) * H });
      }
      const wt = g.top + g.score;   // world height of this platform
      if (wt >= g.nextRocket && boardWorld(lv) - wt > H * 0.35) {
        g.rockets.push({ x: clamp(x + rand(-0.15, 0.15) * W, W * 0.1, W * 0.9), y: g.top + H * 0.11 });
        g.nextRocket = wt + stageLen() * rand(0.9, 1.8);
      }
    }
  }

  function startMove() {
    g.moveT = 0; g.turns = 1;
    if (g.special) {   // stage-up celebration
      g.special = false;
      g.move = Math.random() < 0.5 ? "flip" : "backflip";
      g.turns = 2;
      return;
    }
    g.move = MOVES[Math.floor(Math.random() * MOVES.length)];
    if ((g.move === "flip" || g.move === "backflip" || g.move === "spin") && Math.random() < Math.min(0.4, 0.08 * g.level)) g.turns = 2;
  }

  function newGame(startLevel) {
    startLevel = startLevel || 1;
    const points = (startLevel - 1) * LEVEL_POINTS;
    g = {
      level: startLevel, genStage: startLevel,
      pw: PLAYER_SIZE * W,
      scale: Math.min(MAX_GROWTH, 1 + GROWTH_PER_LEVEL * (startLevel - 1)),
      px: W / 2, bx: W / 2, py: H * 0.09, vy: JUMP_VELOCITY * H, vx: 0, tilt: 0,   // py = feet
      score: points / 100 * H,
      nextMark: (Math.floor(points / MILESTONE_EVERY) + 1) * MILESTONE_EVERY,
      bannerT: startLevel > 1 ? 1.4 : 0, bannerText: startLevel > 1 ? "STAGE " + startLevel : "",
      hardT: 0, special: false, over: false,
      celeb: null, rocket: null,
      platforms: [{ x: W / 2, y: H * 0.08, w: W, vx: 0, board: false, done: true, stage: 0 }],
      top: H * 0.08,
      stars: [], rockets: [], fruits: [], parts: [], popups: [], shock: null,
      nextRocket: 0,
      move: "none", moveT: 0, turns: 1,
      hint: 6, newBest: false, time: 0,
      burnT: 0, slipT: 0, slipVx: 0, char: 0, panicOff: 0, panicTarget: 0, panicT: 0, smokeT: 0,
      spawnT: 1.2, shakeT: 0, flashT: 0, finalPoints: 0
    };
    g.nextRocket = g.score + stageLen() * rand(0.25, 0.5);   // first rocket appears early in stage 1
    fill();
    startMove();
    if (isHard()) { g.hardT = 3; }
  }

  // ============================================================
  // Effects: particles, pop-up texts
  // ============================================================
  function addPart(x, y, vx, vy, life, size, color, grav) {
    if (g.parts.length > 400) return;
    g.parts.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, size: size, color: color, g: grav || 0 });
  }
  function burst(x, y, n, colors, speed, grav) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(0.25, 1) * speed;
      addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.4, 0.9), rand(2, 5) * (W / 400), colors[Math.floor(Math.random() * colors.length)], grav);
    }
  }
  function popup(text, x, y, color) { g.popups.push({ text: text, x: x, y: y, t: 0, color: color }); }
  function updateFx(dt) {
    for (let i = g.parts.length - 1; i >= 0; i--) {
      const p = g.parts[i];
      p.life -= dt;
      if (p.life <= 0) { g.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    }
    for (let i = g.popups.length - 1; i >= 0; i--) {
      const q = g.popups[i];
      q.t += dt; q.y -= H * 0.06 * dt;
      if (q.t > 1) g.popups.splice(i, 1);
    }
    if (g.shock) { g.shock.t += dt; if (g.shock.t > 0.5) g.shock = null; }
  }

  // ============================================================
  // Falling fruit: banana (slip), bomb (explodes + fire), tomato (cure)
  // ============================================================
  function spawnGap() {
    let base = Math.max(0.6, 3.2 - 0.3 * (g.level - 1));   // faster rain every stage
    if (isHard()) base = Math.max(0.4, base * 0.5);         // hard stages: double rain
    return base * rand(0.7, 1.3);
  }
  function spawnFruit() {
    const hasEffect = g.burnT > 0 || g.slipT > 0;
    const haveTomato = g.fruits.some(function (f) { return f.type === "tomato"; });
    const bananas = g.level >= 3;   // bananas start at stage 3, bombs from stage 1
    let type;
    if (hasEffect && !haveTomato && Math.random() < 0.7) type = "tomato";
    else {
      const r = Math.random();
      if (!bananas) type = r < 0.92 ? "bomb" : "tomato";
      else type = r < Math.min(0.6, 0.4 + 0.02 * g.level) ? "bomb" : (r < 0.9 ? "banana" : "tomato");
    }
    const speedK = 0.3 + 0.03 * Math.min(g.level, 20);
    g.fruits.push({
      type: type, x: rand(W * 0.06, W * 0.94), y: -H * 0.05,
      vy: H * speedK * (isHard() ? 1.25 : 1) * rand(0.9, 1.15),
      rot: rand(0, 6.28), spin: rand(-2.5, 2.5), sway: rand(0, 6.28)
    });
  }
  function hitFruit(f) {
    if (f.type === "banana") {
      g.slipT = SLIP_TIME; g.slipVx = g.vx;
      popup("SLIP!", f.x, f.y, "#ffe135");
      burst(f.x, f.y, 10, ["#ffe135", "#fff3a0"], H * 0.25, 200);
      play("slip");
    } else if (f.type === "bomb") {
      g.burnT = BURN_TIME; g.shakeT = 0.35; g.flashT = 0.25;
      g.shock = { x: f.x, y: f.y, t: 0 };
      popup("BOOM!", f.x, f.y, "#ff6a1a");
      burst(f.x, f.y, 40, ["#ffdd44", "#ff8c1a", "#ff4d1a", "#ffffff"], H * 0.5, H * 0.3);
      play("boom");
    } else {
      if (g.burnT > 0 || g.slipT > 0) {
        g.burnT = 0; g.slipT = 0; g.slipVx = 0; g.char *= 0.3;
        popup("Cured!", f.x, f.y, "#7dffb0");
        burst(f.x, f.y, 18, ["#e53935", "#ff8a80", "#7dffb0"], H * 0.3, H * 0.2);
      } else popup("Yum!", f.x, f.y, "#ff8a80");
      play("cure");
    }
  }

  // ============================================================
  // World scrolling, rocket flight, stage-end celebration
  // ============================================================
  function scrollWorld(shift) {
    if (shift <= 0) return;
    g.top -= shift; g.score += shift;
    for (const p of g.platforms) p.y -= shift;
    for (const s of g.stars) s.y -= shift;
    for (const r of g.rockets) r.y -= shift;
    g.platforms = g.platforms.filter(function (p) { return p.y > -H * 0.08; });
    g.stars = g.stars.filter(function (s) { return s.y > -H * 0.1; });
    g.rockets = g.rockets.filter(function (r) { return r.y > -H * 0.15; });
    fill();
  }

  function grabRocket(r) {
    g.rocket = { stage: g.level + ROCKET_SKIP - 1, t: 0 };   // fly up to the plank of this stage
    g.fruits = []; g.burnT = 0; g.slipT = 0; g.slipVx = 0; g.char = 0;
    g.vy = 0; g.flashT = 0.2;
    popup("ROCKET! +" + ROCKET_SKIP + " STAGES", W / 2, H - r.y, "#8fd3ff");
    burst(r.x, H - r.y, 24, ["#ffb020", "#ff5a1a", "#ffe14d", "#ffffff"], H * 0.4, 0);
    play("rocket");
  }

  function updateRocket(dt) {
    const r = g.rocket;
    r.t += dt;
    g.vy = 0;
    g.py += (H * 0.5 - g.py) * Math.min(1, dt * 6);
    let board = null;
    for (const p of g.platforms) { if (p.board && p.stage === r.stage) { board = p; break; } }
    const remaining = board ? board.y - g.py : Infinity;
    if (board && remaining <= 2) {   // arrived at the plank
      g.rocket = null;
      startCelebration(board);
      return;
    }
    const speed = board ? clamp(remaining * 3, H * 1.4, H * 9) : H * 9;
    let shift = speed * dt;
    if (board) shift = Math.min(shift, Math.max(0, remaining));
    scrollWorld(shift);
    for (let i = 0; i < 3; i++) {   // flame trail
      addPart(g.px + rand(-0.15, 0.15) * g.pw, H - g.py + g.pw * 1.5, rand(-30, 30), H * rand(0.3, 0.6), rand(0.3, 0.6),
        g.pw * rand(0.08, 0.16), ["#ffb020", "#ff5a1a", "#ffe14d"][Math.floor(Math.random() * 3)], 0);
    }
    if (r.t > 10) { g.rocket = null; g.vy = 0; }   // safety net
  }

  function startCelebration(p) {
    g.py = p.y; g.vy = 0;
    p.done = true;
    g.celeb = { t: 0, stage: p.stage, board: p, conf: 0 };
    g.burnT = 0; g.slipT = 0; g.slipVx = 0; g.char *= 0.3;
    g.fruits = [];
    g.move = "dance"; g.moveT = 0.5; g.turns = 1;
    cups++; saveNum("nattat_cups", cups);
    burst(g.px, H - g.py - g.pw, 30, ["#ffd933", "#ff6a6a", "#6ad1ff", "#7dffb0", "#ffffff"], H * 0.5, H * 0.3);
    play("cup");
    happytime();
  }

  function updateCelebration(dt) {
    const c = g.celeb;
    c.t += dt;
    g.vy = 0;
    if (g.py > H * 0.28) {   // slide the plank down so the trophy has room
      const shift = (g.py - H * 0.28) * Math.min(1, dt * 3);
      g.py -= shift;
      scrollWorld(shift);
    }
    g.py = c.board.y;
    c.conf -= dt;
    if (c.conf <= 0) {   // confetti
      c.conf = 0.05;
      addPart(rand(0, W), -H * 0.02, rand(-30, 30), H * rand(0.2, 0.35), rand(1.2, 2), rand(2, 4) * (W / 400),
        ["#ffd933", "#ff6a6a", "#6ad1ff", "#7dffb0", "#ffffff"][Math.floor(Math.random() * 5)], H * 0.05);
    }
    if (c.t >= CELEB_TIME) finishCelebration();
  }

  function finishCelebration() {
    g.level = g.celeb.stage + 1;
    g.celeb = null;
    if (g.level > bestStage) { bestStage = g.level; saveNum("nattat_beststage", bestStage); }
    g.special = true;   // double flip on the first jump of the new stage
    startMove();
    g.vy = JUMP_VELOCITY * H;
    g.bannerT = 1.6; g.bannerText = "STAGE " + g.level;
    g.spawnT = rand(1.2, 2.0);
    play("levelup");
    if (isHard()) { g.hardT = 3; play("hard"); }
  }

  // ============================================================
  // Poses: dance, flips, spin, panic (fire), dizzy (slip), rocket
  // ============================================================
  function getPose() {
    const t = g.moveT;
    const air = 2 * JUMP_VELOCITY / GRAVITY;
    const prog = Math.min(t / (air * 0.85), 1);
    const ease = prog * prog * (3 - 2 * prog);
    const k = clamp(g.vy / (JUMP_VELOCITY * H), -1, 1);
    const arms = -20 + 70 * k;
    const pose = { angle: 0, sx: 1, sy: 1, armL: arms, armR: arms, legL: 0, legR: 0 };
    if (g.move === "flip" || g.move === "backflip") {
      const dir = g.move === "backflip" ? 1 : -1;
      pose.angle = dir * 360 * g.turns * ease;
      pose.armL = pose.armR = 25;
    } else if (g.move === "dance") {
      const s = Math.sin(t * 16);
      pose.angle = 12 * Math.sin(t * 8);
      pose.armL = 55 + 45 * s; pose.armR = 55 - 45 * s;
      pose.legL = 0.16 * s; pose.legR = -0.16 * s;
    } else if (g.move === "spin") {
      pose.sx = Math.max(0.15, Math.abs(Math.cos(2 * Math.PI * g.turns * ease)));
    }
    if (t < 0.12) {   // squash when landing
      const q = 1 - t / 0.12;
      pose.sy *= 1 - 0.3 * q;
      pose.sx *= 1 + 0.25 * q;
    }
    if (g.slipT > 0) {   // slipping: wobbly, arms waving
      pose.angle += 28 * Math.sin(g.time * 9);
      pose.armL = pose.armR = 70 + 30 * Math.sin(g.time * 12);
    }
    if (g.burnT > 0) {   // on fire: panic!
      pose.armL = 70 + 70 * Math.sin(g.time * 40);
      pose.armR = 70 + 70 * Math.sin(g.time * 40 + Math.PI);
      pose.legL = 0.22 * Math.sin(g.time * 36);
      pose.legR = -pose.legL;
      pose.angle += 10 * Math.sin(g.time * 30);
    }
    if (g.rocket) {   // riding the rocket, arms up
      pose.angle = 0; pose.sx = 1; pose.sy = 1;
      pose.armL = pose.armR = 110; pose.legL = pose.legR = 0;
    }
    pose.angle += g.tilt;   // lean toward the finger
    return pose;
  }

  // ============================================================
  // Game loop
  // ============================================================
  function update(dt) {
    g.time += dt; g.moveT += dt;
    if (g.bannerT > 0) g.bannerT -= dt;
    if (g.hint > 0) g.hint -= dt;
    if (g.hardT > 0) g.hardT -= dt;
    if (g.shakeT > 0) g.shakeT -= dt;
    if (g.flashT > 0) g.flashT -= dt;
    const target = Math.min(MAX_GROWTH, 1 + GROWTH_PER_LEVEL * (g.level - 1));
    g.scale += (target - g.scale) * Math.min(1, dt * 4);
    g.pw = PLAYER_SIZE * W * g.scale;
    const totalH = g.pw * 1.3;
    updateFx(dt);
    if (g.over) return;

    // ----- control: follow the finger (slippery after a banana) -----
    const prevPx = g.px;
    const kb = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (g.slipT > 0) {
      let acc = 0;
      if (kb !== 0) { acc = kb * W * 7; input.x = null; }
      else if (input.x !== null) acc = (input.x - g.bx) * 40;
      g.slipVx += acc * dt;
      g.slipVx *= Math.max(0, 1 - 1.4 * dt);
      g.bx += g.slipVx * dt;
      if (g.bx < 0) { g.bx = 0; g.slipVx = Math.abs(g.slipVx) * 0.5; }
      if (g.bx > W) { g.bx = W; g.slipVx = -Math.abs(g.slipVx) * 0.5; }
    } else {
      g.slipVx = 0;
      if (kb !== 0) { g.bx += kb * W * 1.1 * dt; input.x = null; }
      else if (input.x !== null) g.bx = input.x;
    }
    g.bx = clamp(g.bx, 0, W);

    // ----- status effects -----
    if (g.burnT > 0) {
      g.burnT = Math.max(0, g.burnT - dt);
      g.panicT -= dt;   // hopping around in panic
      if (g.panicT <= 0) { g.panicT = 0.28; g.panicTarget = rand(-0.2, 0.2) * W; }
      g.smokeT -= dt;
      if (g.smokeT <= 0) {
        g.smokeT = 0.06;
        addPart(g.px + rand(-0.3, 0.3) * g.pw, H - (g.py + g.pw * 0.9), rand(-15, 15), -H * 0.09, rand(0.6, 1.1), g.pw * 0.12, "#555", 0);
      }
    } else g.panicTarget = 0;
    if (g.slipT > 0) g.slipT = Math.max(0, g.slipT - dt);
    g.panicOff += (g.panicTarget - g.panicOff) * Math.min(1, dt * 10);
    g.char += ((g.burnT > 0 ? 0.85 : 0) - g.char) * Math.min(1, dt * (g.burnT > 0 ? 2 : 0.6));
    g.px = clamp(g.bx + g.panicOff, 0, W);
    if (dt > 0) g.vx += ((g.px - prevPx) / dt - g.vx) * Math.min(1, dt * 12);
    g.tilt = -clamp(g.vx / (W * 2), -1, 1) * 18;

    // ----- sliding platforms -----
    for (const p of g.platforms) {
      if (p.vx !== 0) {
        p.x += p.vx * dt;
        const h2 = p.w / 2;
        if (p.x < h2) { p.x = h2; p.vx = Math.abs(p.vx); }
        else if (p.x > W - h2) { p.x = W - h2; p.vx = -Math.abs(p.vx); }
      }
    }

    // ----- physics (or rocket flight / celebration) -----
    if (g.rocket) updateRocket(dt);
    else if (g.celeb) updateCelebration(dt);
    else {
      const prevFeet = g.py;
      g.vy -= GRAVITY * H * dt;
      g.py += g.vy * dt;
      // the plank at the end of the current stage: touching it (from above or below) finishes the stage
      let bd = null;
      for (const p of g.platforms) { if (p.board && !p.done && p.stage === g.level) { bd = p; break; } }
      if (bd && ((prevFeet < bd.y && g.py >= bd.y) || (g.vy <= 0 && prevFeet >= bd.y - 1 && g.py <= bd.y))) {
        startCelebration(bd);
      } else if (g.vy <= 0) {   // landing on a platform
        const half = g.pw / 2;
        for (let i = 0; i < g.platforms.length; i++) {
          const p = g.platforms[i];
          if (prevFeet >= p.y - 1 && g.py <= p.y && Math.abs(g.px - p.x) <= p.w / 2 + half * 0.6) {
            g.py = p.y; g.vy = JUMP_VELOCITY * H;
            play("bounce"); startMove();
            if (p.fragile) {   // cracking platform: breaks after one bounce
              g.platforms.splice(i, 1);
              burst(p.x, H - p.y, 12, ["#d9b98a", "#8a6a3b", "#ffffff"], H * 0.25, H * 0.4);
              play("crack");
            }
            break;
          }
        }
      }
      if (!g.celeb && g.py > H * 0.6) {   // scroll the world down
        const shift = g.py - H * 0.6;
        g.py -= shift;
        scrollWorld(shift);
      }
    }

    // ----- collect stars and rockets -----
    const bodyUp = g.py + g.pw * 0.28 + g.pw * 0.5;   // body center (y up)
    for (let i = g.stars.length - 1; i >= 0; i--) {
      const s = g.stars[i];
      if (Math.hypot(s.x - g.px, s.y - bodyUp) < g.pw * 0.5 + W * 0.04) {
        g.stars.splice(i, 1);
        totalStars++; saveNum("nattat_stars", totalStars);
        popup("+1", s.x, H - s.y, "#ffe14d");
        burst(s.x, H - s.y, 8, ["#ffe14d", "#fff6a8"], H * 0.2, 0);
        play("star");
      }
    }
    if (!g.rocket && !g.celeb) {
      for (let i = g.rockets.length - 1; i >= 0; i--) {
        const r = g.rockets[i];
        if (Math.hypot(r.x - g.px, r.y - bodyUp) < g.pw * 0.5 + W * 0.07) {
          g.rockets.splice(i, 1);
          grabRocket(r);
          break;
        }
      }
    }

    // ----- falling fruit (bombs from stage 1; harder every stage) -----
    if (!g.rocket && !g.celeb) {
      {
        g.spawnT -= dt;
        if (g.spawnT <= 0) {
          spawnFruit();
          if (g.level >= 6 && Math.random() < Math.min(0.6, 0.1 * (g.level - 5))) spawnFruit();   // double rain
          g.spawnT = spawnGap();
        }
      }
      const pcx = g.px, pcy = H - bodyUp;   // body center (y down)
      for (let i = g.fruits.length - 1; i >= 0; i--) {
        const f = g.fruits[i];
        f.y += f.vy * dt;
        f.x += Math.sin(g.time * 2 + f.sway) * W * 0.03 * dt;
        f.rot += f.spin * dt;
        if (f.y > H * 1.1) { g.fruits.splice(i, 1); continue; }
        if (Math.hypot(f.x - pcx, f.y - pcy) < g.pw * 0.42 + W * 0.032) {
          g.fruits.splice(i, 1);
          hitFruit(f);
        }
      }
    }

    // ----- score, milestone chime, falling off -----
    const points = Math.floor(g.score / H * 100);
    if (!g.rocket && points >= g.nextMark) play("milestone");
    while (points >= g.nextMark) g.nextMark += MILESTONE_EVERY;

    if (!g.rocket && !g.celeb && g.py + totalH < 0) {   // fell off the bottom
      g.over = true;
      g.finalPoints = points;
      if (points > best) { best = points; g.newBest = true; saveNum("nattat_best", best); }
      play("over");
      gameplayStop();
    }
  }

  // ============================================================
  // Drawing
  // ============================================================
  const stars = [];
  for (let i = 0; i < 40; i++) stars.push({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.4, d: 0.04 + Math.random() * 0.12 });

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  function drawStar(x, y, r, color, rot) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? r : r * 0.45;
      if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawTrophy(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = "#ffcc2f"; ctx.strokeStyle = "#ffcc2f"; ctx.lineWidth = s * 0.09;
    ctx.beginPath(); ctx.arc(-s * 0.55, -s * 0.3, s * 0.22, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.55, -s * 0.3, s * 0.22, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s * 0.55, -s * 0.65);
    ctx.lineTo(s * 0.55, -s * 0.65);
    ctx.quadraticCurveTo(s * 0.55, s * 0.05, 0, s * 0.12);
    ctx.quadraticCurveTo(-s * 0.55, s * 0.05, -s * 0.55, -s * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(-s * 0.09, s * 0.1, s * 0.18, s * 0.28);
    roundRect(-s * 0.35, s * 0.36, s * 0.7, s * 0.16, s * 0.05);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.35, s * 0.07, s * 0.22, 0.2, 0, Math.PI * 2); ctx.fill();
    drawStar(0, -s * 0.32, s * 0.17, "#fff5b0", 0);
    ctx.restore();
  }

  function drawBanana(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#ffe135"; ctx.lineWidth = r * 0.75;
    ctx.beginPath(); ctx.arc(0, -r * 0.6, r, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.strokeStyle = "#8a6a12"; ctx.lineWidth = r * 0.22;
    ctx.beginPath(); ctx.arc(0, -r * 0.6, r * 1.28, 0.16 * Math.PI, 0.2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r * 0.6, r * 1.28, 0.8 * Math.PI, 0.84 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawBomb(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(Math.sin(t * 3) * 0.2);
    ctx.fillStyle = "#1f1f27";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.35, r * 0.2, r * 0.12, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3a3a46";
    ctx.fillRect(-r * 0.18, -r * 1.12, r * 0.36, r * 0.25);
    ctx.strokeStyle = "#a9793a"; ctx.lineWidth = Math.max(2, r * 0.12); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -r * 1.1); ctx.quadraticCurveTo(r * 0.5, -r * 1.5, r * 0.8, -r * 1.35); ctx.stroke();
    drawStar(r * 0.8, -r * 1.35, r * (0.28 + 0.1 * Math.sin(t * 25)), "#ffb020", t * 4);
    ctx.restore();
  }

  function drawTomato(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = "#e53935";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.35, r * 0.2, r * 0.12, -0.6, 0, Math.PI * 2); ctx.fill();
    drawStar(0, -r * 0.85, r * 0.5, "#2e9e3a", 0);
    ctx.restore();
  }

  // upright rocket, s = total height
  function drawRocket(cx, cy, s, t, flame) {
    const w = s * 0.34;
    ctx.save();
    ctx.translate(cx, cy);
    if (flame) {
      const fl = 0.8 + 0.3 * Math.sin(t * 45);
      ctx.fillStyle = "#ff7a1a";
      ctx.beginPath(); ctx.moveTo(-w * 0.42, s * 0.3); ctx.quadraticCurveTo(0, s * (0.3 + 0.7 * fl), w * 0.42, s * 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe14d";
      ctx.beginPath(); ctx.moveTo(-w * 0.24, s * 0.3); ctx.quadraticCurveTo(0, s * (0.3 + 0.45 * fl), w * 0.24, s * 0.3); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#d63b3b";   // fins
    ctx.beginPath(); ctx.moveTo(-w * 0.5, s * 0.1); ctx.lineTo(-w * 1.05, s * 0.36); ctx.lineTo(-w * 0.5, s * 0.3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w * 0.5, s * 0.1); ctx.lineTo(w * 1.05, s * 0.36); ctx.lineTo(w * 0.5, s * 0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9edf5";   // body
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.5);
    ctx.quadraticCurveTo(w * 0.75, -s * 0.2, w * 0.5, s * 0.3);
    ctx.lineTo(-w * 0.5, s * 0.3);
    ctx.quadraticCurveTo(-w * 0.75, -s * 0.2, 0, -s * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d63b3b";   // nose
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.5);
    ctx.quadraticCurveTo(w * 0.42, -s * 0.34, w * 0.36, -s * 0.22);
    ctx.lineTo(-w * 0.36, -s * 0.22);
    ctx.quadraticCurveTo(-w * 0.42, -s * 0.34, 0, -s * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4aa3ff";   // window
    ctx.beginPath(); ctx.arc(0, -s * 0.02, w * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8894a8"; ctx.lineWidth = Math.max(1, s * 0.03); ctx.stroke();
    ctx.restore();
  }

  function drawFlames(cx, cy, bw, bh) {
    for (let i = -3; i <= 3; i++) {
      const u = i / 3 * 0.9;
      const bx = cx + u * bw / 2;
      const by = cy - (bh / 2) * Math.sqrt(1 - u * u) + bh * 0.08;
      const hh = bh * (0.6 + 0.25 * Math.sin(g.time * 18 + i * 1.7));
      const ww = bw * 0.17;
      const sway = Math.sin(g.time * 14 + i) * ww * 0.5;
      ctx.fillStyle = "#ff5a1a";
      ctx.beginPath();
      ctx.moveTo(bx - ww, by);
      ctx.quadraticCurveTo(bx - ww * 0.5, by - hh * 0.5, bx + sway, by - hh);
      ctx.quadraticCurveTo(bx + ww * 0.5, by - hh * 0.5, bx + ww, by);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffd23a";
      ctx.beginPath();
      ctx.moveTo(bx - ww * 0.5, by);
      ctx.quadraticCurveTo(bx - ww * 0.25, by - hh * 0.3, bx + sway * 0.6, by - hh * 0.62);
      ctx.quadraticCurveTo(bx + ww * 0.25, by - hh * 0.3, bx + ww * 0.5, by);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawPlayer() {
    const pose = getPose();
    const pw = g.pw;
    const bw = pw * pose.sx, bh = pw * pose.sy;
    const leg = pw * 0.28;
    const arm = pw * 0.42 * (0.3 + 0.7 * pose.sx);
    const lw = Math.max(2, pw * 0.07);
    const cx = g.px;
    const cy = H - (g.py + leg + bh / 2);   // body center on screen
    const bodyCol = mix([255, 217, 51], [43, 28, 16], g.char);   // turns black from the fire
    const limbCol = mix([242, 153, 26], [30, 19, 10], g.char);

    if (g.rocket) drawRocket(cx, cy + pw * 1.05, pw * 2.6, g.time, true);   // riding a rocket

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-pose.angle * Math.PI / 180);
    ctx.lineCap = "round"; ctx.lineWidth = lw; ctx.strokeStyle = limbCol;
    const sides = [[-1, pose.legL, pose.armL], [1, pose.legR, pose.armR]];
    for (const s of sides) {
      const side = s[0];
      ctx.beginPath();
      ctx.moveTo(side * bw * 0.2, bh / 2);
      ctx.lineTo(side * bw * 0.2 + s[1] * pw, bh / 2 + leg);
      ctx.stroke();
      const a = s[2] * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(side * bw / 2, -bh * 0.05);
      ctx.lineTo(side * bw / 2 + side * Math.cos(a) * arm, -bh * 0.05 - Math.sin(a) * arm);
      ctx.stroke();
    }
    ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.ellipse(0, 0, bw / 2, bh / 2, 0, 0, Math.PI * 2); ctx.fill();
    const look = clamp(g.vx / (W * 1.5), -1, 1);
    const ew = bw * 0.22, eh = bh * 0.26;
    for (const side of [-1, 1]) {
      const ex = side * bw * 0.2, ey = -bh * 0.12;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(ex, ey, ew / 2, eh / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath(); ctx.arc(ex + look * ew * 0.2, ey, ew * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    if (g.burnT > 0) {   // screaming mouth
      ctx.fillStyle = "#3a1408";
      ctx.beginPath(); ctx.ellipse(0, bh * 0.16, bw * 0.12, bh * (0.1 + 0.05 * Math.sin(g.time * 30)), 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = "#80400d"; ctx.lineWidth = Math.max(1.5, lw * 0.6);
      ctx.beginPath(); ctx.arc(0, bh * 0.02, bw * 0.16, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
    ctx.restore();

    if (g.burnT > 0) drawFlames(cx, cy, bw, bh);
    if (g.slipT > 0) {   // dizzy stars around the head
      for (let i = 0; i < 3; i++) {
        const a = g.time * 6 + i * 2.09;
        drawStar(cx + Math.cos(a) * bw * 0.45, cy - bh * 0.62 + Math.sin(a) * bh * 0.1, pw * 0.11, "#ffe135", g.time * 5);
      }
    }
  }

  // the long wooden plank at the end of every stage
  function drawBoard(p) {
    const bh = H * 0.055;
    const top = H - p.y;
    const grad = ctx.createLinearGradient(0, top, 0, top + bh);
    grad.addColorStop(0, "#c98a45");
    grad.addColorStop(1, "#7a4a1e");
    ctx.fillStyle = grad;
    ctx.fillRect(0, top, W, bh);
    ctx.fillStyle = "#e3b476";
    ctx.fillRect(0, top, W, bh * 0.14);
    ctx.strokeStyle = "rgba(60,30,10,0.22)";
    ctx.lineWidth = Math.max(1, H * 0.0022);
    for (const k of [0.38, 0.72]) {
      ctx.beginPath(); ctx.moveTo(0, top + bh * k); ctx.lineTo(W, top + bh * k); ctx.stroke();
    }
    ctx.fillStyle = "#3b2a1a";
    for (const nx of [W * 0.04, W * 0.96]) {
      ctx.beginPath(); ctx.arc(nx, top + bh * 0.55, bh * 0.09, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#5a3612";
    ctx.fillRect(0, top + bh - bh * 0.1, W, bh * 0.1);
    text(BOARD_TEXT, W / 2, top + bh * 0.56, bh * 0.62, "#fff3c4", "center", "#4a2a0c");
  }

  function text(str, x, y, size, color, align, stroke) {
    ctx.font = "bold " + Math.round(size) + "px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    if (stroke) { ctx.lineWidth = size * 0.12; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function overButtons() {
    const btns = [];
    const bw = W * 0.74, bh = H * 0.07, x = (W - bw) / 2;
    let y = H * 0.68;
    if (totalStars >= STARS_TO_KEEP) {
      btns.push({ x: x, y: y, w: bw, h: bh, action: "keep", color: "#27ae60", label: "Continue here (-" + STARS_TO_KEEP + " stars)" });
      y += bh * 1.3;
    }
    btns.push({ x: x, y: y, w: bw, h: bh, action: "new", color: "#3d7bff", label: TEST_LEVEL > 1 ? "Play again (Stage " + TEST_LEVEL + ")" : "Play again" });
    return btns;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#07080f";
    ctx.fillRect(0, 0, vw, vh);
    ctx.save();
    ctx.beginPath(); ctx.rect(fieldX, 0, W, H); ctx.clip();
    ctx.translate(fieldX, 0);
    if (g.shakeT > 0) ctx.translate(rand(-1, 1) * W * 0.012, rand(-1, 1) * W * 0.012);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    const hard = isHard();
    bg.addColorStop(0, hard ? "#3a1b3f" : "#1b1e4a");
    bg.addColorStop(1, hard ? "#1c0d1f" : "#0d0f24");
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    for (const s of stars) {
      const y = (s.y * H + g.score * s.d) % H;
      ctx.beginPath(); ctx.arc(s.x * W, y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // platforms (color changes with the stage; sliding ones are marked with arrows)
    const th = H * 0.015;
    for (const p of g.platforms) {
      if (p.board) { drawBoard(p); continue; }
      const hue = (130 + (Math.max(1, p.stage) - 1) * 28) % 360;
      const sliding = p.vx !== 0;
      ctx.fillStyle = p.fragile ? "#d9b98a" : (sliding ? "hsl(" + ((hue + 170) % 360) + ",80%,62%)" : "hsl(" + hue + ",65%,55%)");
      roundRect(p.x - p.w / 2, H - p.y, p.w, th, th / 2);
      ctx.fill();
      if (p.fragile) {   // cracks
        const y0 = H - p.y;
        ctx.strokeStyle = "#6b4a22"; ctx.lineWidth = Math.max(1, th * 0.14); ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.x - p.w * 0.14, y0); ctx.lineTo(p.x - p.w * 0.05, y0 + th * 0.55);
        ctx.lineTo(p.x + p.w * 0.04, y0 + th * 0.2); ctx.lineTo(p.x + p.w * 0.14, y0 + th);
        ctx.stroke();
      }
      if (sliding) {
        const ay = H - p.y + th / 2, ah = th * 0.7, x0 = p.x - p.w / 2, x1 = p.x + p.w / 2;
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.moveTo(x0 + th * 1.5, ay - ah / 2); ctx.lineTo(x0 + th * 0.7, ay); ctx.lineTo(x0 + th * 1.5, ay + ah / 2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x1 - th * 1.5, ay - ah / 2); ctx.lineTo(x1 - th * 0.7, ay); ctx.lineTo(x1 - th * 1.5, ay + ah / 2); ctx.closePath(); ctx.fill();
      }
    }

    // collectible stars and rockets
    for (const s of g.stars) {
      const pulse = 1 + 0.12 * Math.sin(g.time * 6 + s.x);
      drawStar(s.x, H - s.y, W * 0.04 * pulse, "#ffe14d", g.time * 0.8);
    }
    for (const r of g.rockets) {
      const bob = Math.sin(g.time * 4 + r.x) * H * 0.006;
      drawRocket(r.x, H - r.y + bob, W * 0.13, g.time, true);
    }

    // falling fruit
    for (const f of g.fruits) {
      const r = W * 0.035;
      if (f.type === "banana") drawBanana(f.x, f.y, r, f.rot);
      else if (f.type === "bomb") drawBomb(f.x, f.y, r, g.time + f.sway);
      else drawTomato(f.x, f.y, r, f.rot);
    }

    drawPlayer();

    // shockwave, particles, pop-ups
    if (g.shock) {
      ctx.globalAlpha = 1 - g.shock.t / 0.5;
      ctx.strokeStyle = "#ffb020"; ctx.lineWidth = W * 0.02;
      ctx.beginPath(); ctx.arc(g.shock.x, g.shock.y, W * (0.05 + g.shock.t * 0.5), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (const p of g.parts) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const q of g.popups) {
      ctx.globalAlpha = clamp(1 - q.t, 0, 1);
      text(q.text, q.x, q.y, H * 0.035, q.color, "center", "rgba(0,0,0,0.6)");
    }
    ctx.globalAlpha = 1;

    // ----- HUD -----
    const fs = Math.max(14, H * 0.022);
    const points = Math.floor(g.score / H * 100);
    text(String(points), W / 2, H * 0.06, fs * 1.8, "#fff", "center", "rgba(0,0,0,0.35)");
    // progress to the plank of the current stage
    const into = clamp((g.score + g.py - (g.level - 1) * stageLen()) / stageLen(), 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    roundRect(W * 0.3, H * 0.093, W * 0.4, H * 0.008, H * 0.004); ctx.fill();
    ctx.fillStyle = "#ffd933";
    roundRect(W * 0.3, H * 0.093, Math.max(H * 0.008, W * 0.4 * into), H * 0.008, H * 0.004); ctx.fill();
    text("Stage " + g.level, 12, H * 0.035, fs * 1.3, hard ? "#ff7a7a" : "#ffd933", "left", "rgba(0,0,0,0.35)");
    drawStar(20, H * 0.035 + fs * 1.7, fs * 0.6, "#ffe14d", 0);
    text(String(totalStars) + (totalStars >= STARS_TO_KEEP ? " (continue ready)" : " / " + STARS_TO_KEEP), 36, H * 0.035 + fs * 1.7, fs * 0.85, "#fff", "left");
    if (cups > 0) {
      drawTrophy(20, H * 0.035 + fs * 3.4, fs * 1.1);
      text("x " + cups, 38, H * 0.035 + fs * 3.4, fs * 0.85, "#fff", "left");
    }
    roundRect(W - 122, 8, 114, 32, 8);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
    text(muted ? "Sound: OFF" : "Sound: ON", W - 65, 24, fs * 0.8, "#fff", "center");

    if (g.rocket && !g.over) text("ROCKET! Flying to stage " + (g.rocket.stage + 1), W / 2, H * 0.125, fs, "#8fd3ff", "center", "rgba(0,0,0,0.5)");
    else if (g.burnT > 0 && !g.over) text("ON FIRE! Catch a tomato (" + Math.ceil(g.burnT) + "s)", W / 2, H * 0.125, fs, "#ff8a4a", "center", "rgba(0,0,0,0.5)");
    else if (g.slipT > 0 && !g.over) text("SLIPPERY! (" + Math.ceil(g.slipT) + "s)", W / 2, H * 0.125, fs, "#ffe135", "center", "rgba(0,0,0,0.5)");

    if (g.flashT > 0) {
      ctx.fillStyle = "rgba(255,240,200," + (g.flashT / 0.25 * 0.5) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (g.bannerT > 0 && !g.over && !g.celeb) {
      ctx.globalAlpha = Math.min(1, g.bannerT / 0.5);
      text(g.bannerText, W / 2, H * 0.3, H * 0.07, "#ffd933", "center", "#000");
      ctx.globalAlpha = 1;
    }
    if (g.hardT > 0 && !g.over && !g.celeb) {
      ctx.globalAlpha = Math.min(1, g.hardT / 0.6);
      text("HARD STAGE!", W / 2, H * 0.38, H * 0.05, "#ff5a5a", "center", "#000");
      text("Fruit rain - watch out for bombs", W / 2, H * 0.43, H * 0.026, "#fff", "center", "#000");
      ctx.globalAlpha = 1;
    }

    // stage complete: trophy + 3 second countdown
    if (g.celeb && !g.over) {
      const c = g.celeb;
      ctx.globalAlpha = Math.min(1, c.t / 0.3);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, H * 0.12, W, H * 0.48);
      const bob = Math.sin(g.time * 5) * H * 0.008;
      drawTrophy(W / 2, H * 0.29 + bob, H * 0.14);
      text("STAGE " + c.stage + " COMPLETE!", W / 2, H * 0.42, H * 0.04, "#ffd933", "center", "#000");
      text("Cup #" + cups, W / 2, H * 0.465, H * 0.028, "#fff", "center", "#000");
      const n = Math.max(1, Math.ceil(CELEB_TIME - c.t));
      const nextHard = (c.stage + 1) % HARD_EVERY === 0;
      text((nextHard ? "HARD STAGE " : "Stage ") + (c.stage + 1) + " starts in " + n, W / 2, H * 0.52, H * 0.03, nextHard ? "#ff7a7a" : "#fff", "center", "#000");
      text(newAt(c.stage + 1), W / 2, H * 0.565, H * 0.024, "#8fd3ff", "center", "#000");
      ctx.globalAlpha = 1;
    }

    if (g.hint > 0 && !g.over) {
      ctx.globalAlpha = Math.min(1, g.hint / 1.5);
      text("Move mouse / drag / arrow keys", W / 2, H * 0.94, fs, "#fff", "center");
      ctx.globalAlpha = 1;
    }

    if (g.over) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, W, H);
      text("Game Over", W / 2, H * 0.24, H * 0.06, "#fff", "center");
      text("Score: " + g.finalPoints, W / 2, H * 0.32, H * 0.04, "#ffd933", "center");
      text("Stage " + g.level, W / 2, H * 0.37, H * 0.032, "#fff", "center");
      text((g.newBest ? "New best! " : "Best: ") + best, W / 2, H * 0.415, H * 0.03, "#7dffb0", "center");
      text("Best stage: " + Math.max(bestStage, g.level), W / 2, H * 0.455, H * 0.024, "#9fc4ff", "center");
      text("Stars: " + totalStars + "   Cups: " + cups, W / 2, H * 0.495, H * 0.028, "#ffe14d", "center");
      if (totalStars < STARS_TO_KEEP) text("Collect " + STARS_TO_KEEP + " stars to continue here", W / 2, H * 0.54, H * 0.024, "#bbb", "center");
      for (const b of overButtons()) {
        roundRect(b.x, b.y, b.w, b.h, b.h * 0.3);
        ctx.fillStyle = b.color; ctx.fill();
        text(b.label, b.x + b.w / 2, b.y + b.h / 2, b.h * 0.4, "#fff", "center");
      }
    }
    ctx.restore();
  }

  // ============================================================
  // Input: the player follows your finger / mouse
  // ============================================================
  function toField(e) { return clamp(e.clientX - fieldX, 0, W); }
  function hitMute(e) {
    const x = e.clientX - fieldX, y = e.clientY;
    return x >= W - 122 && x <= W - 8 && y >= 8 && y <= 40;
  }
  // stars let you carry on from the place where you fell: same stage, same height, same world
  function continueGame() {
    g.over = false; g.newBest = false;
    g.rocket = null; g.celeb = null;
    g.fruits = []; g.burnT = 0; g.slipT = 0; g.slipVx = 0; g.char = 0; g.panicOff = 0; g.panicTarget = 0;
    g.platforms.push({ x: W / 2, y: H * 0.08, w: W, vx: 0, board: false, fragile: false, done: true, stage: 0 });   // safety platform
    g.py = H * 0.09; g.vy = JUMP_VELOCITY * H; g.vx = 0;
    g.spawnT = 1.5; g.hint = 0;
    g.bannerT = 1.2; g.bannerText = "CONTINUE!";
    startMove();
  }
  function requestRestart(action) {
    if (restarting) return;
    restarting = true;
    const keep = action === "keep" && totalStars >= STARS_TO_KEEP;
    if (keep) {
      totalStars -= STARS_TO_KEEP;
      saveNum("nattat_stars", totalStars);
    }
    midgameAd(function () {
      if (keep) continueGame(); else newGame(TEST_LEVEL);
      restarting = false;
      if (!paused) gameplayStart();
    });
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    audioInit();
    if (hitMute(e)) { toggleMute(); return; }
    if (g.over) {
      const x = e.clientX - fieldX, y = e.clientY;
      for (const b of overButtons()) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { requestRestart(b.action); return; }
      }
      return;
    }
    // the newest finger always takes over, so a lost touch can never lock the controls
    input.active = true;
    input.id = e.pointerId;
    input.touch = e.pointerType !== "mouse";
    if (input.touch) {   // touch: drag anywhere, the player moves with your finger (no jump to the finger)
      input.ax = toField(e); input.abx = g.bx; input.x = g.bx;
    } else input.x = toField(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse") input.x = toField(e);
    else if (input.active && e.pointerId === input.id) input.x = clamp(input.abx + (toField(e) - input.ax) * TOUCH_SENS, 0, W);
  });
  function releaseTouch() {
    input.active = false; input.id = null;
    if (input.touch) input.x = null;
  }
  function pointerEnd(e) {
    audioInit();   // iOS only unlocks sound after a finger is lifted
    if (e.pointerType !== "mouse" && e.pointerId === input.id) releaseTouch();
  }
  canvas.addEventListener("pointerup", pointerEnd);
  canvas.addEventListener("pointercancel", pointerEnd);
  // stop the browser from scrolling / zooming / opening menus while playing
  ["touchstart", "touchmove", "touchend"].forEach(function (t) {
    canvas.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  window.addEventListener("keydown", function (e) {
    if (["ArrowUp", "ArrowDown", " "].indexOf(e.key) !== -1) e.preventDefault();   // no page scroll
    audioInit();
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    if (e.key === "m" || e.key === "M") toggleMute();
    if (g.over) {
      if (e.key === " " || e.key === "Enter") requestRestart(overButtons()[0].action);   // main button
      if (e.key === "r" || e.key === "R") requestRestart("new");
    }
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });
  window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("resize", resize);
  window.addEventListener("blur", function () { keys.left = keys.right = false; releaseTouch(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { paused = true; releaseTouch(); gameplayStop(); }
    else { paused = false; last = performance.now(); if (!g.over && !restarting) gameplayStart(); }
  });

  // ============================================================
  // Start
  // ============================================================
  function frame(ts) {
    const dt = Math.min((ts - last) / 1000, 1 / 30);
    last = ts;
    if (!paused && !adActive && dt > 0) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  resize();
  newGame(TEST_LEVEL);
  initSDK();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
